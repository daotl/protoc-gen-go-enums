syntax = "proto3";

package daotl.proto;
option go_package = "github.com/daotl/protoc-gen-go-enums/pbgen";

import "google/protobuf/descriptor.proto";

extend google.protobuf.EnumOptions {
  // Enable generation of Go constants from enums with
  // type prefix stripped. (Default: true)
  bool gen_go_enums = 91720;
  // Turn const name from snake case into pascal case.
  bool gen_go_enums_name_pascal_case = 91721;
}
